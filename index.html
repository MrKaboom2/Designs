<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Works</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg: #07080a;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --pill-bg: rgba(255, 255, 255, 0.04);
      --pill-active: rgba(255, 255, 255, 0.12);
      --glass-nav: rgba(7, 8, 10, 0.7);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: rgba(0, 0, 0, 0.02);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.2);
      --pill-bg: rgba(0, 0, 0, 0.05);
      --pill-active: rgba(0, 0, 0, 0.12);
      --glass-nav: rgba(248, 250, 252, 0.7);
    }

    [data-theme="cyberpunk"] {
      --bg: #030308;
      --card-bg: rgba(0, 255, 204, 0.03);
      --card-border: rgba(0, 255, 204, 0.15);
      --text-main: #00ffcc;
      --text-muted: #ff0055;
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.4);
      --pill-bg: rgba(0, 255, 204, 0.05);
      --pill-active: rgba(255, 0, 85, 0.2);
      --glass-nav: rgba(3, 3, 8, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 120px;
      transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease;
    }

    /* Floating Ultra-Modern Header */
    nav {
      position: sticky;
      top: 24px;
      z-index: 100;
      max-width: 1280px;
      margin: 0 auto 60px;
      padding: 0 24px;
    }

    .nav-inner {
      background: var(--glass-nav);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.9rem;
    }

    /* Modern Control Segmented Controls (No native selects) */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .segmented-group {
      display: flex;
      align-items: center;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      padding: 3px;
      border-radius: 12px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .pill-btn:hover {
      color: var(--text-main);
    }

    .pill-btn.active {
      background: var(--pill-active);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Main Content Container */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* MASONRY LAYOUT: Preserves natural image aspect ratios in columns */
    .gallery.masonry {
      column-count: 3;
      column-gap: var(--gap, 28px);
    }

    .gallery.masonry .card {
      break-inside: avoid;
      margin-bottom: var(--gap, 28px);
    }

    .gallery.masonry .img-wrapper {
      height: auto;
    }

    .gallery.masonry .img-wrapper img {
      height: auto;
      object-fit: contain;
    }

    /* GRID LAYOUT: Forces uniform aspect ratio (Uniform Square Grid) */
    .gallery.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--gap, 28px);
    }

    .gallery.grid .card {
      margin-bottom: 0;
    }

    .gallery.grid .img-wrapper {
      aspect-ratio: 4 / 5;
    }

    .gallery.grid .img-wrapper img {
      height: 100%;
      object-fit: cover;
    }

    /* Ultra-Sleek Card Design */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: var(--accent);
      box-shadow: 0 20px 40px -15px var(--accent-glow);
    }

    .img-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: rgba(0, 0, 0, 0.2);
    }

    .img-wrapper img {
      width: 100%;
      display: block;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover .img-wrapper img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
      transition: opacity 0.3s ease;
    }

    .card-info.hidden {
      display: none;
    }

    .card-info h3 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .card-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 700;
    }

    @media (max-width: 960px) {
      .gallery.masonry { column-count: 2; }
      .nav-inner { flex-direction: column; gap: 16px; align-items: stretch; }
      .controls { justify-content: space-between; }
    }

    @media (max-width: 600px) {
      .gallery.masonry { column-count: 1; }
      .controls { flex-direction: column; align-items: stretch; }
      .segmented-group { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Floating Nav Controls -->
  <nav>
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-dot"></div>
        <h1>Selected Works <span>/ Visuals</span></h1>
      </div>

      <div class="controls">
        <!-- True Masonry vs Uniform Grid Switcher -->
        <div class="segmented-group">
          <button class="pill-btn active" id="btnMasonry" onclick="setLayout('masonry')">Masonry</button>
          <button class="pill-btn" id="btnGrid" onclick="setLayout('grid')">Uniform Grid</button>
        </div>

        <!-- Custom Theme Segment -->
        <div class="segmented-group">
          <button class="pill-btn active" onclick="setTheme('dark', this)">Dark</button>
          <button class="pill-btn" onclick="setTheme('light', this)">Light</button>
          <button class="pill-btn" onclick="setTheme('cyberpunk', this)">Neon</button>
        </div>

        <!-- Density Segment -->
        <div class="segmented-group">
          <button class="pill-btn active" onclick="setSpacing('comfortable', this)">Comfort</button>
          <button class="pill-btn" onclick="setSpacing('compact', this)">Compact</button>
        </div>

        <!-- Title Toggle -->
        <div class="segmented-group">
          <button class="pill-btn active" id="btnTitles" onclick="toggleTitles()">Titles</button>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="gallery masonry" id="gallery">
      <!-- Fanta -->
      <div class="card">
        <div class="img-wrapper">
          <img src="FANTA.png" alt="Fanta Commercial Design">
        </div>
        <div class="card-info">
          <h3>Fanta Commercial Concept</h3>
          <span class="card-tag">Brand</span>
        </div>
      </div>

      <!-- Fight Club V2 -->
      <div class="card">
        <div class="img-wrapper">
          <img src="FIGHT CLUB V2.png" alt="Fight Club Poster Variant">
        </div>
        <div class="card-info">
          <h3>Fight Club — Variant</h3>
          <span class="card-tag">Poster</span>
        </div>
      </div>

      <!-- Fight Club Classic -->
      <div class="card">
        <div class="img-wrapper">
          <img src="FIGHT CLUB.png" alt="Fight Club Classic Poster">
        </div>
        <div class="card-info">
          <h3>Fight Club — Classic</h3>
          <span class="card-tag">Poster</span>
        </div>
      </div>

      <!-- Messi -->
      <div class="card">
        <div class="img-wrapper">
          <img src="MESSI.png" alt="Messi GOAT Edition">
        </div>
        <div class="card-info">
          <h3>Messi — The GOAT Edition</h3>
          <span class="card-tag">Sports</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Distinct Masonry vs Uniform Grid Logic
    function setLayout(mode) {
      const gallery = document.getElementById('gallery');
      const btnMasonry = document.getElementById('btnMasonry');
      const btnGrid = document.getElementById('btnGrid');

      if (mode === 'grid') {
        gallery.className = 'gallery grid';
        btnGrid.classList.add('active');
        btnMasonry.classList.remove('active');
      } else {
        gallery.className = 'gallery masonry';
        btnMasonry.classList.add('active');
        btnGrid.classList.remove('active');
      }
    }

    // Modern Segmented Theme Toggle
    function setTheme(theme, btn) {
      btn.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (theme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
    }

    // Spacing Handler
    function setSpacing(density, btn) {
      btn.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const root = document.documentElement;
      root.style.setProperty('--gap', density === 'compact' ? '14px' : '28px');
    }

    // Title Toggle
    let titlesVisible = true;
    function toggleTitles() {
      titlesVisible = !titlesVisible;
      const infos = document.querySelectorAll('.card-info');
      const btn = document.getElementById('btnTitles');

      infos.forEach(info => info.classList.toggle('hidden', !titlesVisible));
      btn.classList.toggle('active', titlesVisible);
    }
  </script>
</body>
</html>
