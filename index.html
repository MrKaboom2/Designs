<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Portfolio</title>
  <style>
    /* CSS Styles */
    :root {
      --bg-color: #0d0e12;
      --card-bg: #16181e;
      --accent: #ff3e3e;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --border-color: #262933;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      text-align: center;
      padding: 60px 20px 30px;
      max-width: 800px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Filter Controls */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      padding: 0 20px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Gallery Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .gallery-item {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .img-container {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background-color: #000;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover .img-container img {
      transform: scale(1.05);
    }

    .item-info {
      padding: 16px;
    }

    .item-info h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .item-info p {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal img {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>DESIGN PORTFOLIO</h1>
    <p>Graphics, Posters, & Digital Artworks</p>
  </header>

  <div class="filter-container">
    <button class="filter-btn active" onclick="filterGallery('all')">All</button>
    <button class="filter-btn" onclick="filterGallery('posters')">Posters</button>
    <button class="filter-btn" onclick="filterGallery('sports')">Sports</button>
    <button class="filter-btn" onclick="filterGallery('cinema')">Cinema</button>
  </div>

  <main class="gallery">
    <!-- Design 1 -->
    <div class="gallery-item" data-category="cinema" onclick="openModal(this)">
      <div class="img-container">
        <img src="https://via.placeholder.com/800x1000/111/fff?text=Joker+Poster" alt="Joker Poster Design">
      </div>
      <div class="item-info">
        <h3>Joker — Theatrical Edit</h3>
        <p>Cinema</p>
      </div>
    </div>

    <!-- Design 2 -->
    <div class="gallery-item" data-category="sports" onclick="openModal(this)">
      <div class="img-container">
        <img src="https://via.placeholder.com/800x1000/004d25/fff?text=Shakib+Al+Hasan" alt="Shakib Al Hasan Graphic">
      </div>
      <div class="item-info">
        <h3>Shakib Al Hasan — The All Rounder</h3>
        <p>Sports</p>
      </div>
    </div>

    <!-- Design 3 -->
    <div class="gallery-item" data-category="posters" onclick="openModal(this)">
      <div class="img-container">
        <img src="https://via.placeholder.com/800x1000/222/fff?text=Cyberpunk+Poster" alt="Cyberpunk Concept">
      </div>
      <div class="item-info">
        <h3>Neon City 2077</h3>
        <p>Posters</p>
      </div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="modal" id="imageModal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Enlarged View">
  </div>

  <script>
    // Filtering Logic
    function filterGallery(category) {
      const items = document.querySelectorAll('.gallery-item');
      const buttons = document.querySelectorAll('.filter-btn');

      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      items.forEach(item => {
        if (category === 'all' || item.getAttribute('data-category') === category) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }

    // Modal Logic
    function openModal(element) {
      const imgSrc = element.querySelector('img').src;
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
  </script>
</body>
</html>
