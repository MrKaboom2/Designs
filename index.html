<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Works</title>
  <style>
    /* CSS Variables & Themes */
    :root {
      --bg: #090a0f;
      --card-bg: #12141c;
      --card-hover: #181b26;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --border: #1e293b;
      --accent: #ff3e3e;
      --glow: rgba(255, 62, 62, 0.12);
      --glass-bg: rgba(9, 10, 15, 0.85);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --glow: rgba(37, 99, 235, 0.12);
      --glass-bg: rgba(248, 250, 252, 0.85);
    }

    [data-theme="cyberpunk"] {
      --bg: #05050a;
      --card-bg: #0d0e17;
      --card-hover: #141524;
      --text-main: #00ffcc;
      --text-muted: #ff0055;
      --border: rgba(0, 255, 204, 0.2);
      --accent: #ff0055;
      --glow: rgba(255, 0, 85, 0.25);
      --glass-bg: rgba(5, 5, 10, 0.85);
    }

    [data-theme="sunset"] {
      --bg: #120d1c;
      --card-bg: #1e142d;
      --card-hover: #291b3d;
      --text-main: #ffd166;
      --text-muted: #f72585;
      --border: rgba(255, 209, 102, 0.15);
      --accent: #f72585;
      --glow: rgba(247, 37, 133, 0.2);
      --glass-bg: rgba(18, 13, 28, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding-bottom: 100px;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Clean, Organized Top Bar */
    header {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 40px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    /* Sticky Control Toolbar */
    .toolbar-container {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 40px;
      margin-bottom: 50px;
      transition: border-color 0.4s ease;
    }

    .controls-bar {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .control-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
    }

    select, button {
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    .icon-btn {
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .icon-btn.active {
      background: var(--border);
      color: var(--accent);
    }

    /* Main Container & Gallery */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* Masonry Mode */
    .gallery.masonry {
      column-count: 3;
      column-gap: var(--gap, 36px);
    }

    .gallery.masonry .gallery-item {
      break-inside: avoid;
      margin-bottom: var(--gap, 36px);
    }

    /* Grid Mode */
    .gallery.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--gap, 36px);
    }

    /* Card Styling */
    .gallery-item {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
    }

    .gallery-item:hover {
      transform: translateY(-6px);
      background: var(--card-hover);
      border-color: var(--accent);
      box-shadow: 0 16px 36px var(--glow);
    }

    .img-container {
      width: 100%;
      overflow: hidden;
    }

    .img-container img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-item:hover .img-container img {
      transform: scale(1.02);
    }

    .item-info {
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      transition: border-color 0.4s ease;
    }

    .item-info.hidden {
      display: none;
    }

    .item-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    @media (max-width: 1024px) {
      .gallery.masonry { column-count: 2; }
    }

    @media (max-width: 650px) {
      header, .toolbar-container, main { padding-left: 20px; padding-right: 20px; }
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .controls-bar { justify-content: flex-start; gap: 12px; }
      .gallery.masonry { column-count: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Selected Works</h1>
      <p>Design & Visual Artworks</p>
    </div>
  </header>

  <div class="toolbar-container">
    <div class="controls-bar">
      <!-- Layout Switcher -->
      <div class="control-group">
        <label>Layout</label>
        <button id="masonryBtn" class="icon-btn active" onclick="setLayout('masonry')">Masonry</button>
        <button id="gridBtn" class="icon-btn" onclick="setLayout('grid')">Grid</button>
      </div>

      <!-- Theme Switcher -->
      <div class="control-group">
        <label>Theme</label>
        <select id="themeSelect" onchange="setTheme(this.value)">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="sunset">Sunset</option>
        </select>
      </div>

      <!-- Spacing Switcher -->
      <div class="control-group">
        <label>Spacing</label>
        <select id="densitySelect" onchange="setDensity(this.value)">
          <option value="comfortable">Comfortable</option>
          <option value="compact">Compact</option>
        </select>
      </div>

      <!-- Info Toggle -->
      <div class="control-group">
        <label>Titles</label>
        <button id="titleBtn" class="icon-btn active" onclick="toggleTitles()">Show</button>
      </div>
    </div>
  </div>

  <main>
    <div class="gallery masonry" id="gallery">
      <!-- Fanta -->
      <div class="gallery-item">
        <div class="img-container">
          <img src="FANTA.png" alt="Fanta Commercial Graphic">
        </div>
        <div class="item-info">
          <h3>Fanta — Commercial Concept</h3>
        </div>
      </div>

      <!-- Fight Club V2 -->
      <div class="gallery-item">
        <div class="img-container">
          <img src="FIGHT CLUB V2.png" alt="Fight Club Project Mayhem Poster V2">
        </div>
        <div class="item-info">
          <h3>Fight Club — Variant</h3>
        </div>
      </div>

      <!-- Fight Club -->
      <div class="gallery-item">
        <div class="img-container">
          <img src="FIGHT CLUB.png" alt="Fight Club Project Mayhem Poster">
        </div>
        <div class="item-info">
          <h3>Fight Club — Classic</h3>
        </div>
      </div>

      <!-- Messi -->
      <div class="gallery-item">
        <div class="img-container">
          <img src="MESSI.png" alt="Messi GOAT World Cup Poster">
        </div>
        <div class="item-info">
          <h3>Messi — The GOAT</h3>
        </div>
      </div>
    </div>
  </main>

  <script>
    function setLayout(mode) {
      const gallery = document.getElementById('gallery');
      const masonryBtn = document.getElementById('masonryBtn');
      const gridBtn = document.getElementById('gridBtn');

      if (mode === 'grid') {
        gallery.classList.remove('masonry');
        gallery.classList.add('grid');
        gridBtn.classList.add('active');
        masonryBtn.classList.remove('active');
      } else {
        gallery.classList.remove('grid');
        gallery.classList.add('masonry');
        masonryBtn.classList.add('active');
        gridBtn.classList.remove('active');
      }
    }

    function setTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
    }

    function setDensity(density) {
      const root = document.documentElement;
      if (density === 'compact') {
        root.style.setProperty('--gap', '18px');
      } else {
        root.style.setProperty('--gap', '36px');
      }
    }

    let showTitles = true;
    function toggleTitles() {
      showTitles = !showTitles;
      const infos = document.querySelectorAll('.item-info');
      const titleBtn = document.getElementById('titleBtn');

      infos.forEach(info => {
        if (showTitles) {
          info.classList.remove('hidden');
          titleBtn.classList.add('active');
          titleBtn.innerText = 'Show';
        } else {
          info.classList.add('hidden');
          titleBtn.classList.remove('active');
          titleBtn.innerText = 'Hide';
        }
      });
    }
  </script>
</body>
</html>
