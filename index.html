<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Works</title>
  <style>
    /* Default Theme: Dark Slate */
    :root {
      --bg: #0a0a0c;
      --card-bg: #121316;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --border: #1e293b;
      --accent: #e2e8f0;
    }

    /* Light Theme */
    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #0f172a;
    }

    /* Neon / Cyberpunk Theme */
    [data-theme="neon"] {
      --bg: #05050a;
      --card-bg: #0d0e17;
      --text-main: #00ffcc;
      --text-muted: #ff0055;
      --border: #ff0055;
      --accent: #00ffcc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 40px 20px 80px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      transition: border-color 0.3s ease;
    }

    .brand h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Theme Picker Dropdown */
    .theme-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-selector label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .theme-dropdown {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
    }

    /* Masonry / Natural Column Layout */
    .gallery {
      column-count: 3;
      column-gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 24px;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .img-container {
      width: 100%;
    }

    /* Fully uncropped image display */
    .img-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .item-info {
      padding: 16px 20px;
    }

    .item-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    @media (max-width: 900px) {
      .gallery {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .gallery {
        column-count: 1;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Selected Works</h1>
      <p>Graphic Design & Visual Concepts</p>
    </div>

    <div class="theme-selector">
      <label for="themeSelect">Theme:</label>
      <select id="themeSelect" class="theme-dropdown" onchange="changeTheme(this.value)">
        <option value="dark">Dark Slate</option>
        <option value="light">Minimal Light</option>
        <option value="neon">Cyberpunk Neon</option>
      </select>
    </div>
  </header>

  <main class="gallery">
    <!-- Joker -->
    <div class="gallery-item">
      <div class="img-container">
        <img src="JOKER.png" alt="Joker Poster Design">
      </div>
      <div class="item-info">
        <h3>Joker</h3>
      </div>
    </div>

    <!-- Fanta -->
    <div class="gallery-item">
      <div class="img-container">
        <img src="FANTA.png" alt="Fanta Commercial Graphic">
      </div>
      <div class="item-info">
        <h3>Fanta Concept</h3>
      </div>
    </div>

    <!-- Fight Club V2 -->
    <div class="gallery-item">
      <div class="img-container">
        <img src="FIGHT CLUB V2.png" alt="Fight Club Project Mayhem Poster V2">
      </div>
      <div class="item-info">
        <h3>Fight Club (Variant)</h3>
      </div>
    </div>

    <!-- Fight Club -->
    <div class="gallery-item">
      <div class="img-container">
        <img src="FIGHT CLUB.png" alt="Fight Club Project Mayhem Poster">
      </div>
      <div class="item-info">
        <h3>Fight Club</h3>
      </div>
    </div>

    <!-- Messi -->
    <div class="gallery-item">
      <div class="img-container">
        <img src="MESSI.png" alt="Messi GOAT World Cup Poster">
      </div>
      <div class="item-info">
        <h3>Messi</h3>
      </div>
    </div>
  </main>

  <script>
    function changeTheme(themeName) {
      if (themeName === 'dark') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', themeName);
      }
    }
  </script>
</body>
</html>
